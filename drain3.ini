[SNAPSHOT]
# How often (minutes) to snapshot the parser state
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
# Single-line JSON list of masking rules
masking = [{"regex_pattern":"((?<=[^A-Za-z0-9])|^)(([0-9a-f]{2,}:){3,}([0-9a-f]{2,}))((?=[^A-Za-z0-9])|$)","mask_with":"ID"},{"regex_pattern":"((?<=[^A-Za-z0-9])|^)(\\d{1,3}(?:\\.\\d{1,3}){3})((?=[^A-Za-z0-9])|$)","mask_with":"IP"},{"regex_pattern":"((?<=[^A-Za-z0-9])|^)([0-9A-Fa-f]{6,}(?: ?[0-9A-Fa-f]{6,})+)((?=[^A-Za-z0-9])|$)","mask_with":"SEQ"},{"regex_pattern":"((?<=[^A-Za-z0-9])|^)(0x[0-9A-Fa-f]+)((?=[^A-Za-z0-9])|$)","mask_with":"HEX"},{"regex_pattern":"((?<=[^A-Za-z0-9])|^)([\\-\\+]?\\d+)((?=[^A-Za-z0-9])|$)","mask_with":"NUM"},{"regex_pattern":"(?<=cmd=)(\".*?\")","mask_with":"CMD"}]
mask_prefix = "<:"
mask_suffix = ":>"

[DRAIN]
# Template clustering parameters
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1024
# split tokens on underscores too
extra_delimiters = ["_"]

[PROFILING]
enabled = True
report_sec = 30
